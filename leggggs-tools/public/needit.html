    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0ebe0;
      font-family: 'Special Elite', monospace;
      min-height: 100vh;
      padding: 3rem 1.5rem 4rem;
    }

    .wrap { max-width: 600px; margin: 0 auto; }

    .main-title {
      font-family: 'Realce', sans-serif;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.05;
      color: #111;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .intro {
      font-size: 14px;
      color: #555;
      font-style: italic;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 3px solid #111;
      line-height: 1.6;
    }

    .form-card {
      background: #fff;
      border: 2px solid #111;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-card::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: -5px; bottom: -5px;
      background: #111;
      z-index: -1;
    }

    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 10px;
    }

    .product-input {
      width: 100%;
      font-family: 'Special Elite', monospace;
      font-size: 16px;
      border: none;
      border-bottom: 2px solid #111;
      background: transparent;
      padding: 6px 0 8px;
      color: #111;
      outline: none;
    }

    .product-input::placeholder { color: #bbb; font-style: italic; font-size: 14px; }

    .submit-btn {
      width: 100%;
      font-family: 'Realce', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: #111;
      color: #f0ebe0;
      border: none;
      padding: 16px;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: opacity 0.15s;
    }

    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      display: none;
      background: #fff;
      border: 2px solid #111;
      padding: 2.5rem 1.75rem;
      position: relative;
      text-align: center;
      margin-bottom: 1rem;
    }

    .result.visible { display: block; }

    .result::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: -5px; bottom: -5px;
      background: #111;
      z-index: -1;
    }

    .result-eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 16px;
      line-height: 1.6;
      font-style: italic;
    }

    .verdict {
      font-family: 'Realce', sans-serif;
      font-size: clamp(80px, 20vw, 140px);
      line-height: 1;
      color: #111;
    }

    .again-btn {
      display: none;
      width: 100%;
      font-family: 'Special Elite', monospace;
      font-size: 14px;
      background: transparent;
      border: 1.5px solid #111;
      padding: 11px;
      cursor: pointer;
      color: #111;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    .again-btn:hover { background: #e8e2d5; }
    .again-btn.visible { display: block; }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .stamp {
      display: inline-block;
      border: 1.5px solid #ddd;
      padding: 4px 12px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #ccc;
      text-transform: uppercase;
      transform: rotate(-1.5deg);
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="wrap">

  <h1 class="main-title">Do You Need It?</h1>
  <p class="intro">Oh rad — a new "drop." Enter the product name or URL below and we'll tell you whether you need it or not.</p>

  <div class="form-card">
    <label class="field-label" for="productInput">Product name or URL</label>
    <input class="product-input" id="productInput" type="text" placeholder="e.g. Bandit Nylon HumoFit™ Dad Hat - Anthracite" maxlength="300" autocomplete="off" />
    <button class="submit-btn" id="submitBtn" onclick="checkProduct()">Do I Need It?</button>
  </div>

  <div class="result" id="resultEl">
    <p class="result-eyebrow" id="resultEyebrow"></p>
    <div class="verdict">No.</div>
  </div>

  <button class="again-btn" id="againBtn" onclick="resetForm()">&#8635; Check another product</button>

  <div class="footer">
    <div>Leggggs</div>
    <div class="stamp">A Running Zine</div>
  </div>

</div>

<script>
const placeholders = [
  'e.g. Bandit Nylon HumoFit™ Dad Hat - Anthracite',
  'e.g. SoftCell™ Carré de soie Bandana',
  'e.g. Minted New York Sea Foam Performance 1/4 Zip'
];
let pi = 0;
const input = document.getElementById('productInput');

setInterval(function() {
  if (document.activeElement !== input && !input.value) {
    pi = (pi + 1) % placeholders.length;
    input.placeholder = placeholders[pi];
  }
}, 3000);

function checkProduct() {
  const product = input.value.trim();
  if (!product) { input.focus(); return; }

  let label = product;
  try {
    const url = new URL(product);
    const parts = url.pathname.split('/').filter(Boolean);
    label = parts[parts.length - 1]
      .replace(/-/g, ' ')
      .replace(/\?.*/,  '')
      .trim();
    if (!label) label = url.hostname;
  } catch(e) {}

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('resultEyebrow').textContent = 'Do you need the ' + label + '?';
  document.getElementById('resultEl').classList.add('visible');
  document.getElementById('againBtn').classList.add('visible');
}

function resetForm() {
  input.value = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('resultEl').classList.remove('visible');
  document.getElementById('againBtn').classList.remove('visible');
  input.focus();
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkProduct();
});
</script>
</body>
</html>
